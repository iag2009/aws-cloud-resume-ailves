#---------------------------------------------------------------------
# Publish the AWS-CLOUD-RESUME-AILVES site to S3 and invalidate CloudFront
#
# Version      Date        Info
# 1.0          2024        Initial Version
# 2.0          2026-09     OIDC instead of static keys, CloudFront
#                          invalidation, --delete, updated actions
#
# Made by Aleksandr Ilves Copyleft (c) 2024
#---------------------------------------------------------------------
name: CI-CD-Pipeline-to-AWS-S3

env:
  S3_BUCKET_NAME: "aws-cloud-resume-ailves-dev-source"
  CLOUDFRONT_DISTRIBUTION_ID: "EGALS685DA92T"
  AWS_REGION_NAME: "us-east-2"

on:
  push:
    branches:
      - master
  workflow_dispatch:

# The role is assumed via OIDC (see envs/dev/github_oidc.tf), so the job needs
# an id-token. This previously used AWS_ACCESS_KEY / AWS_SECRET_KEY of the
# github-actions user, whose key dates from 2022.
permissions:
  contents: read
  id-token: write

# Two pushes to master in a row must not race each other syncing the bucket.
concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Git clone our repo
        uses: actions/checkout@v4
        with:
          # The video CV lives in Git LFS but is no longer published to S3,
          # so there is no need to download LFS objects.
          lfs: false

      - name: Configure my AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION_NAME }}

      - name: Sync website directory to S3 bucket
        # --delete removes objects no longer present in the repository. Without
        # it, stale copies lingered for years — notably a second CV file
        # ("Aleksandr Ilves_CV_EuroPass.pdf", with a space) that the
        # Download CV button actually pointed at.
        run: |
          aws s3 sync website/ "s3://${S3_BUCKET_NAME}/" \
            --delete \
            --exclude ".DS_Store" \
            --exclude "*/.DS_Store" \
            --exclude "assets/Alexander_Ilves_Video_CV.mp4"

      - name: Invalidate CloudFront cache
        # The distribution's default_ttl is 3600s and max_ttl is 86400s.
        # Without an invalidation, visitors would see a stale page for up to a day.
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Waiting for invalidation ${invalidation_id}"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"

      - name: Print Happy Message for CI finish
        run: echo "CI Pipeline part Finished successfully!"
