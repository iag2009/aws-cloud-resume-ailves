#---------------------------------------------------------------------
# Проверка Terraform-конфигурации проекта.
#
# Прежняя версия файла была шаблоном-заглушкой из документации GitLab:
# job'ы build/test/deploy печатали echo и спали `sleep 60`, изображая
# 90% покрытия тестами, а job `plan` переприсваивал переменные сам себе
# (export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID) без всякого эффекта.
#
# Здесь остались только те шаги, которые действительно что-то проверяют.
# Деплой сайта живёт в .github/workflows/main.yml — дублировать его тут
# незачем.
#
# Требуются CI/CD-переменные проекта (Settings → CI/CD → Variables):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  — protected + masked
#---------------------------------------------------------------------
image:
  name: hashicorp/terraform:1.15
  entrypoint: [""]

variables:
  TF_ROOT: "${CI_PROJECT_DIR}/envs/dev"
  TF_IN_AUTOMATION: "true"
  AWS_DEFAULT_REGION: "us-east-2"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - ${TF_ROOT}/.terraform

stages:
  - validate
  - plan

# Форматирование проверяем на всём дереве: модули в envs/modules тоже
# должны быть отформатированы.
fmt:
  stage: validate
  script:
    - terraform fmt -recursive -check -diff envs/
  # Расхождение в форматировании не повод блокировать пайплайн.
  allow_failure: true

validate:
  stage: validate
  script:
    - cd "${TF_ROOT}"
    # -backend=false: валидация синтаксиса не требует доступа к state,
    # значит job не нужны креденшелы и он не берёт блокировку.
    - terraform init -backend=false -input=false
    - terraform validate

plan:
  stage: plan
  script:
    - cd "${TF_ROOT}"
    - terraform init -input=false
    - terraform workspace select dev || terraform workspace new dev
    - terraform plan -input=false -var-file=inputs.dev.tfvars.json -out=tfplan
    - terraform show -no-color tfplan > tfplan.txt
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan.txt
    expire_in: 1 week
  rules:
    # plan берёт блокировку state, поэтому запускаем его осознанно, а не
    # на каждый пуш в любую ветку.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: manual
      allow_failure: true
