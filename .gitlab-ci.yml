#---------------------------------------------------------------------
# Terraform configuration checks for this project.
#
# The previous version of this file was the boilerplate template from the
# GitLab docs: the build/test/deploy jobs echoed strings and ran `sleep 60`
# while claiming 90% test coverage, and the `plan` job reassigned variables
# to themselves (export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID) to no effect.
#
# What is left here are only the steps that actually check something. Site
# deployment lives in .github/workflows/main.yml and is not duplicated.
#
# Required project CI/CD variables (Settings -> CI/CD -> Variables):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  — protected + masked
#---------------------------------------------------------------------
image:
  name: hashicorp/terraform:1.15
  entrypoint: [""]

variables:
  TF_ROOT: "${CI_PROJECT_DIR}/envs/dev"
  TF_IN_AUTOMATION: "true"
  AWS_DEFAULT_REGION: "us-east-2"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - ${TF_ROOT}/.terraform

stages:
  - validate
  - plan

# Formatting is checked across the whole tree: the modules under envs/modules
# should be formatted too.
fmt:
  stage: validate
  script:
    - terraform fmt -recursive -check -diff envs/
  # A formatting drift is no reason to block the pipeline.
  allow_failure: true

validate:
  stage: validate
  script:
    - cd "${TF_ROOT}"
    # -backend=false: syntax validation needs no access to state, so this job
    # needs no credentials and takes no lock.
    - terraform init -backend=false -input=false
    - terraform validate

plan:
  stage: plan
  script:
    - cd "${TF_ROOT}"
    - terraform init -input=false
    - terraform plan -input=false -var-file=inputs.dev.tfvars.json -out=tfplan
    - terraform show -no-color tfplan > tfplan.txt
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan.txt
    expire_in: 1 week
  rules:
    # A plan takes a state lock, so run it deliberately rather than on every
    # push to every branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: manual
      allow_failure: true
